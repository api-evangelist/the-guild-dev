- aid: the-guild-dev:graphql-scalars-api
  name: GraphQL Scalars API
  description: Open-source TypeScript/JavaScript library providing 80+ custom GraphQL scalar types (DateTime,
    EmailAddress, UUID, IPv4, IBAN, JSONObject, etc.) for building precise, type-safe GraphQL schemas
    compatible with any GraphQL server implementation.
  tags:
