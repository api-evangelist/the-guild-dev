- aid: the-guild-dev:hive-gateway
  name: Hive Gateway
  description: Hive Gateway is a federated GraphQL routing engine from The Guild that supports both Apollo
    Federation and Schema Stitching approaches to compose distributed GraphQL services.
  humanURL: https://the-guild.dev/graphql/hive/docs/gateway
