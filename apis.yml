- aid: the-guild-dev:graphql-yoga-server
  name: GraphQL Yoga Server
  description: 'GraphQL Yoga is a self-hosted GraphQL server library — each deployment exposes its own
    GraphQL endpoint (default: /graphql). The library handles request parsing, execution, subscriptions,
    file uploads, CORS, and plugin lifecycle for any GraphQL schema you provide.

    '
  tags:
