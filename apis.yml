- aid: the-guild-dev:graphql-mesh-api
  name: GraphQL Mesh API
  description: GraphQL federation framework that composes any API service — REST, OpenAPI, gRPC, SOAP,
    OData, JSON Schema, GraphQL, and databases — into a unified, type-safe GraphQL schema with built-in
    transforms, caching, and mocking.
  tags:
