- aid: the-guild-dev:graphql-tools-api
  name: GraphQL Tools API
  description: A set of utilities for faster GraphQL development, enabling SDL-first schema building,
    type-safe resolver composition, schema stitching across multiple services, fine-grained mocking, and
    schema transformation and delegation.
  tags:
