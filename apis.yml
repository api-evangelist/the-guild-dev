aid: the-guild-dev
name: The Guild
url: https://raw.githubusercontent.com/api-evangelist/the-guild-dev/refs/heads/main/apis.yml
description: The Guild is an open-source software group building much of the GraphQL ecosystem's tooling,
  published together at the-guild.dev. Its portfolio spans GraphQL Hive (schema registry, usage observability
  and breaking-change detection), GraphQL Mesh (composing many APIs into one graph), GraphQL Yoga (server),
  Envelop (plugin runtime), GraphQL Tools and Schema Stitching (schema composition), GraphQL Code Generator
  (typed clients and servers), GraphQL Inspector (schema diffing and CI checks) and GraphQL Scalars. Every
  product listed here shares the-guild.dev as its home, which is why they are profiled as one provider
  with many APIs rather than as separate companies.
