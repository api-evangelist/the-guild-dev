apis:
- aid: the-guild-dev:envelop-api
  name: Envelop API
  description: The @envelop/core package exposes the envelop() function and a set of built-in plugins
    (useSchema, useEngine, useLogger, useMaskedErrors, useExtendContext) that wrap the GraphQL execution
    pipeline — parse, validate, execute, and subscribe — with composable lifecycle hooks.
  tags:
  - GraphQL
  - Plugins
  - Hooks
  - Execution
  humanURL: https://the-guild.dev/graphql/envelop/docs/getting-started
  baseURL: https://the-guild.dev/graphql/envelop
