- aid: the-guild-dev:schema-stitching
  name: Schema Stitching
  description: Schema Stitching is a GraphQL technique for combining multiple GraphQL schemas into a single
    unified API gateway. The @graphql-tools/stitch package creates a combined proxy layer that delegates
    requests through to underlying service APIs, supporting type merging, stitching directives, and automated
    query planning comparable to Apollo Federation.
  humanURL: https://the-guild.dev/graphql/stitching
  tags:
  - API Composition
  - GraphQL
  - Schema Stitching
  - Type Merging
