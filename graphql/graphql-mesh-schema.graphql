# ---------------------------------------------------------------------------
# Query type (introspection of mesh configuration — meta API)
# ---------------------------------------------------------------------------

"""
The Query type exposes introspection of the Mesh configuration itself.
This is the meta-level schema describing the gateway configuration structure.
The actual composed schema served by a running Mesh gateway is generated
from the configured sources and reflects the unified API surface.
"""
type Query {
  """Returns documentation about the Mesh configuration schema version."""
  meshConfigVersion: String

  """
  Placeholder query required by GraphQL SDL specification.
  In a running gateway, the Query type reflects the composed source schemas.
  """
  _meshSchemaInfo: MeshSchemaInfo
}

"""Metadata about the running Mesh gateway schema."""
type MeshSchemaInfo {
  """The merge strategy used (stitching, bare, or federation)."""
  merger: String

  """Names of the configured data sources."""
  sources: [String!]

  """Whether the GraphiQL playground is enabled."""
  playgroundEnabled: Boolean

  """The GraphQL endpoint path."""
  endpoint: String
}
