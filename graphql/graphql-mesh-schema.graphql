  When true, the connection is deferred until the first command.
  Default: true.
  """
  lazyConnect: Boolean
}

"""Redis Sentinel cluster configuration."""
type RedisConfigSentinel {
  """Sentinel group name."""
  name: String!

  """Password for Sentinel instances."""
