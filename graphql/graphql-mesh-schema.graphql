  """Deferred connection. Default: true."""
  lazyConnect: Boolean
}

"""A single Redis Sentinel node."""
type RedisSentinelConfig {
  host: String!
  port: String!
  family: String
}

enum RedisRole {
  master
  slave
}

"""Redis Cluster configuration."""
type RedisConfigCluster {
  """Startup nodes for cluster discovery."""
  startupNodes: [RedisSentinelConfig!]!
  username: String
  password: String
  db: Int
