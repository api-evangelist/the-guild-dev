# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------

"""
Mesh plugin configuration.
Exactly one plugin type should be specified per entry.
"""
type Plugin {
  """Mask internal error details in production responses."""
  maskedErrors: MaskedErrorsPluginConfig

  """
  When present, introspection queries are resolved immediately without
  hitting upstream sources.
  """
  immediateIntrospection: JSON

  """
  When present, identical in-flight requests are deduplicated.
  """
  deduplicateRequest: JSON

  """GraphQL Hive schema registry and usage reporting integration."""
  hive: HivePlugin

  """HTTP response caching at the transport level (CDN-friendly headers)."""
  httpCache: HTTPCachePlugin

  """Expose upstream HTTP response metadata as extensions in GraphQL responses."""
  httpDetailsExtensions: HTTPDetailsExtensionsConfig

  """GraphQL Live Queries support."""
  liveQuery: LiveQueryConfig

  """Schema mocking for development and testing."""
  mock: MockingConfig

  """New Relic APM integration."""
  newrelic: NewrelicConfig

  """Per-operation field-level permission enforcement."""
  operationFieldPermissions: OperationFieldPermissionsConfig

  """Rate limiting at the plugin level."""
  rateLimit: RateLimitPluginConfig

  """GraphQL response caching with automatic cache invalidation."""
  responseCache: ResponseCacheConfig

  """Save operation snapshots to disk for testing and debugging."""
  snapshot: SnapshotPluginConfig

  """StatsD metrics reporting."""
  statsd: StatsdPlugin

  """Prometheus metrics endpoint."""
  prometheus: PrometheusConfig
}

"""Masked errors plugin configuration."""
type MaskedErrorsPluginConfig {
  """Message substituted for internal error details. Default: Unexpected error."""
  errorMessage: String
}

